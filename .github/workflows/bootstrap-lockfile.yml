name: Bootstrap npm lockfile

on:
  push:
    branches: ["feature/**"]

permissions:
  contents: write

jobs:
  generate:
    if: ${{ hashFiles('package-lock.json') == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Generate npm lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify lockfile with clean installation
        run: npm ci

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

  quality:
    needs: generate
    if: ${{ needs.generate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Download generated lockfile
        uses: actions/download-artifact@v4
        with:
          name: generated-package-lock

      - name: Install exact locked dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js application
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: npm run build

  commit-lockfile:
    needs: [generate, quality]
    if: ${{ needs.generate.result == 'success' && needs.quality.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download generated lockfile
        uses: actions/download-artifact@v4
        with:
          name: generated-package-lock

      - name: Commit verified lockfile
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git commit -m "chore(ci): add verified npm lockfile"
          git push origin "HEAD:${BRANCH_NAME}"
