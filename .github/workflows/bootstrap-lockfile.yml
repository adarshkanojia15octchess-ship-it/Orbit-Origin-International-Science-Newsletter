name: Bootstrap npm lockfile

on:
  push:
    branches: ["feature/**"]
    paths-ignore: ["package-lock.json"]

permissions:
  contents: write

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Generate npm lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify lockfile with clean installation
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js application
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: npm run build

      - name: Commit verified lockfile
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git commit -m "chore(ci): add verified npm lockfile"
          git push origin "HEAD:${BRANCH_NAME}"
